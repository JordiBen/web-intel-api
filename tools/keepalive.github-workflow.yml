# To enable: copy this file to .github/workflows/keepalive.yml (needs a token with the "workflow" scope, or add it in the GitHub web UI).
# External keep-alive for the Render free plan (backup for the in-app pinger in app/keepalive.py).
# Render spins a free service down after 15 min without inbound traffic; a cold start takes ~30-60 s,
# longer than marketplace gateway timeouts. GitHub's scheduler runs */10 crons late or skips some runs,
# which is why the in-app pinger stays the primary mechanism.
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 https://web-intel-api.onrender.com/health) && echo "HTTP $code" && [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "health check failed"; exit 1
