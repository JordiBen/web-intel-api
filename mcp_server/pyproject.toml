[project]
name = "web-intel-mcp"
version = "1.0.0"
description = "MCP server: website audit, tech-stack detection, page-to-Markdown, broken links and PDF/OCR for AI agents"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<3", "httpx>=0.27"]

[project.scripts]
web-intel-mcp = "web_intel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_intel_mcp"]
